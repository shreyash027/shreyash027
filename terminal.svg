<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="Terminal style profile card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .bg      { fill: #0a1013; }
    .win     { fill: #0c1418; stroke: #2fd1b8; stroke-width: 1.5; }
    .panel   { fill: #0a1115; stroke: #2fd1b8; stroke-opacity: .75; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .tag     { fill: #0f2a2c; stroke: #2fd1b8; stroke-width: 1; }
    .tagtxt  { fill: #7ff0dc; font-size: 10px; letter-spacing: 1.5px; }
    .title   { fill: #7ff0dc; font-size: 12px; font-weight: bold; }
    .nav     { fill: #6b8088; font-size: 9px; }
    .lbl     { fill: #8aa0a8; font-size: 12px; }
    .val     { fill: #e6f1f3; font-size: 12px; }
    .sec     { fill: #e6f1f3; font-size: 12px; font-weight: bold; }
    .prompt  { fill: #2fd1b8; font-size: 12px; font-weight: bold; }
    .cmd     { fill: #e6f1f3; font-size: 12px; }
    .ok      { fill: #3ddc84; font-size: 10px; }
    .dots    { fill: none; stroke: #cfeff0; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 0.5 5; }
    .scan    { stroke: #2fd1b8; stroke-width: 2; stroke-opacity: .55; animation: scan 4s linear infinite; }
    .l       { opacity: 0; animation: in .5s ease forwards; }
    .cursor  { animation: blink 1s steps(2, start) infinite; fill: #2fd1b8; }
    @keyframes in    { to { opacity: 1; } }
    @keyframes blink { to { visibility: hidden; } }
    @keyframes scan  { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(370px); opacity: 0; } }
  </style>

  <rect class="bg" width="900" height="540" rx="18"/>
  <rect class="win" x="10" y="10" width="880" height="520" rx="18"/>

  <!-- title bar -->
  <circle cx="38" cy="32" r="6" fill="#ff5f56"/>
  <circle cx="58" cy="32" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="32" r="6" fill="#27c93f"/>
  <text class="title" x="105" y="36">YOUR_USERNAME/README.md</text>
  <text class="nav" x="640" y="35">Code</text>
  <text class="nav" x="700" y="35">Projects</text>
  <text class="nav" x="775" y="35">Experience</text>
  <text class="nav" x="850" y="35" text-anchor="end">Contact</text>

  <!-- LEFT PANEL: VISUAL.MAP -->
  <rect class="panel" x="30" y="70" width="380" height="440" rx="10"/>
  <rect class="tag" x="44" y="60" width="96" height="20" rx="3"/>
  <text class="tagtxt" x="52" y="74">VISUAL.MAP</text>

  <!-- Placeholder dotted silhouette: replace with your own dotted/ASCII portrait -->
  <g>
    <ellipse class="dots" cx="220" cy="230" rx="62" ry="78"/>
    <path class="dots" d="M158 210 C160 150 280 150 282 210"/>
    <rect class="dots" x="170" y="215" width="40" height="26" rx="8"/>
    <rect class="dots" x="230" y="215" width="40" height="26" rx="8"/>
    <path class="dots" d="M210 226 L230 226"/>
    <path class="dots" d="M195 300 L195 335"/>
    <path class="dots" d="M245 300 L245 335"/>
    <path class="dots" d="M90 495 C100 395 150 352 195 335"/>
    <path class="dots" d="M350 495 C340 395 290 352 245 335"/>
    <path class="dots" d="M195 335 L220 372 L245 335"/>
  </g>
  <line class="scan" x1="50" y1="110" x2="390" y2="110"/>

  <!-- RIGHT PANEL: SYSTEM_INFO -->
  <rect class="panel" x="430" y="70" width="440" height="440" rx="10"/>
  <rect class="tag" x="444" y="60" width="108" height="20" rx="3"/>
  <text class="tagtxt" x="452" y="74">SYSTEM_INFO</text>

  <g class="l" style="animation-delay:.2s">
    <text class="prompt" x="450" y="112">user@dev:~$</text>
    <text class="cmd" x="535" y="112">./.profile.sh</text>
    <text class="ok" x="850" y="112" text-anchor="end">● online</text>
  </g>

  <g class="l" style="animation-delay:.5s">
    <text class="lbl" x="450" y="140">Name</text><text class="val" x="560" y="140">YOUR_NAME</text>
    <text class="lbl" x="450" y="160">Role</text><text class="val" x="560" y="160">YOUR_ROLE</text>
    <text class="lbl" x="450" y="180">Location</text><text class="val" x="560" y="180">YOUR_CITY, COUNTRY</text>
    <text class="lbl" x="450" y="200">Experience</text><text class="val" x="560" y="200">X+ Years</text>
  </g>
  <g class="l" style="animation-delay:.9s">
    <text class="lbl" x="450" y="220">Stack</text><text class="val" x="560" y="220">TECH_1, TECH_2, TECH_3, TECH_4</text>
    <text class="lbl" x="450" y="240">Focus</text><text class="val" x="560" y="240">YOUR_FOCUS_AREA</text>
    <text class="lbl" x="450" y="260">Interests</text><text class="val" x="560" y="260">INTEREST_1, INTEREST_2, INTEREST_3</text>
  </g>

  <g class="l" style="animation-delay:1.3s">
    <text class="sec" x="450" y="292">Projects</text>
    <text class="lbl" x="465" y="312">PROJECT_ONE</text><text class="val" x="600" y="312">One-line description</text>
    <text class="lbl" x="465" y="332">PROJECT_TWO</text><text class="val" x="600" y="332">One-line description</text>
    <text class="lbl" x="465" y="352">PROJECT_THREE</text><text class="val" x="600" y="352">One-line description</text>
  </g>

  <g class="l" style="animation-delay:1.7s">
    <text class="sec" x="450" y="384">Links</text>
    <text class="lbl" x="465" y="404">GitHub</text><text class="val" x="560" y="404">github.com/YOUR_USERNAME</text>
    <text class="lbl" x="465" y="424">Portfolio</text><text class="val" x="560" y="424">YOUR_WEBSITE</text>
    <text class="lbl" x="465" y="444">LinkedIn</text><text class="val" x="560" y="444">linkedin.com/in/YOUR_HANDLE</text>
    <text class="lbl" x="465" y="464">Instagram</text><text class="val" x="560" y="464">@YOUR_HANDLE</text>
  </g>

  <g class="l" style="animation-delay:2.1s">
    <text class="prompt" x="450" y="494">user@dev:~$</text>
    <rect class="cursor" x="537" y="484" width="8" height="13"/>
  </g>
</svg>
